# ─────────────────────────────────────────────────────────────
# 마켓 펄스 – 추적 시장 설정
# 이 파일만 고치면 추적 시장/키워드를 바꿀 수 있습니다.
#
# groups      : 네이버 데이터랩 검색어 트렌드 주제어 (시장당 최대 4개, 주제어당 검색어 최대 20개)
# seeds       : 검색광고 키워드도구 연관 키워드 시드 (최대 5개, 띄어쓰기는 자동 제거)
# categories  : 네이버 쇼핑인사이트 분야 코드 (아래 shopping_categories 참고)
# match       : 유튜브 인기영상·구글 급상승 검색어에서 이 시장으로 분류할 단어
# ─────────────────────────────────────────────────────────────

# 시장 간 비교를 위한 기준 검색어 (모든 요청에 함께 넣어 지수를 맞춤)
anchor:
  name: 기준(날씨)
  keywords: [날씨]

# 쇼핑 분야 간 비교 기준 분야
shopping_anchor: { name: 생활/건강, code: "50000008" }

shopping_categories:
  - { name: 패션의류, code: "50000000" }
  - { name: 패션잡화, code: "50000001" }
  - { name: 화장품/미용, code: "50000002" }
  - { name: 디지털/가전, code: "50000003" }
  - { name: 가구/인테리어, code: "50000004" }
  - { name: 출산/육아, code: "50000005" }
  - { name: 식품, code: "50000006" }
  - { name: 스포츠/레저, code: "50000007" }
  - { name: 생활/건강, code: "50000008" }
  - { name: 여가/생활편의, code: "50000009" }
  - { name: 도서, code: "50005542" }

markets:
  - id: ad_marketing
    name: 광고·마케팅
    groups:
      - { name: CTV광고, keywords: [CTV광고, CTV 광고, 커넥티드TV광고, 스마트TV광고, OTT광고] }
      - { name: 퍼포먼스마케팅, keywords: [퍼포먼스마케팅, 퍼포먼스 마케팅, 그로스마케팅, 디지털마케팅] }
      - { name: AI광고, keywords: [AI광고, AI 광고, AI광고영상, AI 광고 제작, 생성형AI광고] }
      - { name: 인플루언서마케팅, keywords: [인플루언서마케팅, 인플루언서 광고, 체험단, 숏폼광고] }
    seeds: [CTV광고, 퍼포먼스마케팅, AI광고, 인플루언서마케팅, 숏폼광고]
    categories: []
    match: [광고, 마케팅, 브랜딩, 인플루언서, CTV, 캠페인]

  - id: consumer
    name: 소비재 전반
    groups:
      - { name: 뷰티, keywords: [화장품, 스킨케어, 선크림, 쿠션팩트, 앰플] }
      - { name: 패션, keywords: [패딩, 운동화, 원피스, 가방, 코트] }
      - { name: 식품, keywords: [밀키트, 간편식, 냉동식품, 다이어트도시락] }
      - { name: 리빙가전, keywords: [로봇청소기, 에어프라이어, 가습기, 식기세척기, 건조기] }
    seeds: [화장품, 패딩, 밀키트, 로봇청소기, 운동화]
    categories: ["50000000", "50000001", "50000002", "50000003", "50000004", "50000006"]
    match: [화장품, 뷰티, 패션, 하울, 신상, 언박싱, 리뷰, 밀키트, 다이소, 올리브영]

  - id: ai_tech
    name: AI·테크
    groups:
      - { name: 챗GPT, keywords: [챗GPT, ChatGPT, 지피티, 챗지피티] }
      - { name: 클로드·제미나이, keywords: [클로드, Claude, 제미나이, Gemini] }
      - { name: AI영상, keywords: [AI영상, AI 영상 만들기, 소라, 런웨이, AI 영상 제작] }
      - { name: AI에이전트, keywords: [AI에이전트, AI 에이전트, 바이브코딩, AI 자동화] }
    seeds: [챗GPT, AI영상, 바이브코딩, AI에이전트, 클로드]
    categories: ["50000003"]
    match: [AI, 인공지능, GPT, 챗GPT, 클로드, 제미나이, 아이폰, 갤럭시, 테크]

  - id: golf_leisure
    name: 골프·레저
    groups:
      - { name: 골프, keywords: [골프, 골프장, 골프부킹, 골프레슨] }
      - { name: 스크린골프, keywords: [스크린골프, 골프존, 카카오VX] }
      - { name: 골프용품, keywords: [골프채, 드라이버, 골프공, 골프웨어, 골프화] }
      - { name: 러닝·캠핑, keywords: [러닝화, 마라톤, 캠핑, 글램핑, 등산] }
    seeds: [골프, 스크린골프, 골프웨어, 러닝화, 캠핑]
    categories: ["50000007"]
    match: [골프, 스윙, 드라이버, 캠핑, 러닝, 마라톤, 등산, 낚시]

  - id: travel
    name: 여행
    groups:
      - { name: 해외여행, keywords: [해외여행, 일본여행, 후쿠오카여행, 오사카여행, 베트남여행, 다낭여행] }
      - { name: 국내여행, keywords: [국내여행, 제주도여행, 부산여행, 강릉여행, 경주여행] }
      - { name: 항공권, keywords: [항공권, 특가항공권, 저가항공, 비행기표] }
      - { name: 숙박, keywords: [호텔, 리조트, 펜션, 풀빌라, 료칸] }
    seeds: [해외여행, 일본여행, 항공권, 제주도여행, 호텔]
    categories: ["50000009"]
    match: [여행, 브이로그, 호텔, 일본, 제주, 항공, 투어, 맛집]

  - id: health_food
    name: 건강식품
    groups:
      - { name: 영양제, keywords: [영양제, 종합비타민, 오메가3, 유산균, 비타민D] }
      - { name: 다이어트, keywords: [다이어트보조제, 단백질쉐이크, 프로틴, 체지방감소] }
      - { name: 홍삼·전통, keywords: [홍삼, 정관장, 녹용, 흑염소] }
      - { name: 이너뷰티, keywords: [콜라겐, 저분자콜라겐, 글루타치온, 이너뷰티] }
    seeds: [영양제, 유산균, 프로틴, 홍삼, 콜라겐]
    categories: ["50000008", "50000006"]
    match: [영양제, 건강, 다이어트, 홍삼, 유산균, 비타민, 단백질]

  - id: education
    name: 교육
    groups:
      - { name: 코딩교육, keywords: [코딩교육, 코딩학원, 초등코딩, 파이썬강의] }
      - { name: 영어교육, keywords: [영어학원, 화상영어, 전화영어, 영어회화] }
      - { name: AI교육, keywords: [AI교육, AI 강의, 생성형AI 교육, AI자격증] }
      - { name: 자격증·성인, keywords: [자격증, 국비지원, 내일배움카드, 온라인강의] }
    seeds: [코딩교육, 화상영어, AI교육, 국비지원, 자격증]
    categories: ["50005542"]
    match: [공부, 강의, 수능, 영어, 자격증, 교육, 학원, 코딩]
