name: 인사이트 게시

# 오늘의 인사이트 파일이 올라오면 사이트만 바로 다시 배포 (데이터 수집은 하지 않음)
on:
  push:
    branches: [main]
    paths: ["site/insights/**", "site/crypto/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: market-pulse
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
