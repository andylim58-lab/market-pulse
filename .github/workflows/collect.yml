name: 수집 및 사이트 배포

on:
  schedule:
    # 하루 3회 (한국시간 06:47 / 12:47 / 18:47). 정각을 피해 지연을 줄임
    - cron: "47 21 * * *"
    - cron: "47 3 * * *"
    - cron: "47 9 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-pulse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 데이터 수집 + 분석
        env:
          NAVER_HUB_ID: ${{ secrets.NAVER_HUB_ID }}
          NAVER_HUB_SECRET: ${{ secrets.NAVER_HUB_SECRET }}
          NAVER_LEGACY: ${{ secrets.NAVER_LEGACY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_ACCESS_LICENSE: ${{ secrets.NAVER_AD_ACCESS_LICENSE }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collector/run_all.py

      - name: 수집 데이터 커밋 (히스토리 보관)
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
